name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu, not windows: the app deploys on Windows (Task Scheduler +
    # PowerShell start/stop scripts), but nothing under test here touches
    # any of that - it's FastAPI/SQLite/pure Python throughout. ubuntu-latest
    # is faster and cheaper, and every dependency in requirements.txt ships
    # Linux wheels. The PowerShell deployment scripts have no test coverage
    # of their own yet (out of scope for this suite; they're syntax-checked
    # manually before each deploy today).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      # Type-checks the modules listed in pyproject.toml ([tool.mypy] files); they must stay clean.
      - run: mypy

      - run: pytest -v --cov --cov-report=term

      # Coverage table on the run's summary page (once, on the oldest supported Python). No threshold gate yet.
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "### Test coverage (line + branch)" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker-smoke:
    # Keeps the Dockerfile honest: build it, boot it with dummy credentials, hit /.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pika-smoke .
      - name: Boot and probe
        run: |
          KEY=$(docker run --rm pika-smoke python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name pika -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN=x -e GEMINI_API_KEY=x -e TOKEN_ENCRYPTION_KEY="$KEY" pika-smoke
          for i in $(seq 1 20); do curl -fs localhost:8000/ && break; sleep 2; done
          curl -fs localhost:8000/ | grep -q '"status":"ok"'
          docker exec pika python scripts/create_admin.py 100000001 "CI Admin"
          docker exec pika python scripts/doctor.py || true
          docker logs pika | tail -5
